<!doctype html><html><head><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style></head><body><div id="player"></div><script>
const q=new URLSearchParams(location.search),token=q.get('token'),begin=Number(q.get('start'))||0,autoplay=q.get('play')!=='0';let player,pending=null,waiting=false;
function send(type,value){parent.postMessage({token,type,value},'*')}
// Switching videos reuses this player; a rebuilt iframe would flash blank between videos.
function load(l){waiting=true;const o={videoId:l.id,startSeconds:l.start};l.play?player.loadVideoById(o):player.cueVideoById(o)}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{videoId:q.get('id'),width:'100%',height:'100%',playerVars:{origin:location.origin,playsinline:1,controls:1,start:Math.floor(begin)},events:{onReady:()=>{if(pending){load(pending);pending=null;return}if(begin>0&&autoplay)player.seekTo(begin,true);send('ready',true)},onError:e=>send('error',e.data),onStateChange:e=>{send('state',e.data);if(waiting&&(e.data===1||e.data===5)){waiting=false;send('ready',true)}}}})}
addEventListener('message',e=>{if(e.source!==parent||e.data?.token!==token)return;const{action,value}=e.data;if(action==='load'){if(player)load(value);else pending=value;return}if(!player)return;if(action==='seek')player.seekTo(value,true);if(action==='play')player.playVideo();if(action==='pause')player.pauseVideo();if(action==='toggle')player.getPlayerState()===1?player.pauseVideo():player.playVideo()});
setInterval(()=>{if(player?.getCurrentTime)send('time',player.getCurrentTime())},100);
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
